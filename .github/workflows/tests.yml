name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --requirement requirements-lock-linux-x86_64-py310.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Run smoke tests
        run: python scripts/validate_cleanroom.py --output /tmp/spatios2e-ci-validation.json
      - name: Build distribution artifacts
        run: python -m build --no-isolation --outdir dist-ci
