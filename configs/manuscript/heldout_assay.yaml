design:
  biological_partition: individual-disjoint within cohort
  molecular_partition: target-disjoint from optimization and checkpoint selection
  coordinates: false
  graph: false

spot_input:
  representation: UNI2-h
  dimension: 1536
  frozen: true

gene_representations:
  decima:
    description: Decima v0.5.1 v1_rep0 mean-pooled frozen vectors
    dimension: 1920
    downstream_standardization: feature-wise mean and standard deviation from downstream training genes
    heldout_targets: {hippocampus: 3680, dlpfc: 3680, nac: 3680, her2st: 3184}
  scgpt_whole_human:
    description: static gene-token rows after checkpoint layer normalization
    dimension: 512
    cell_specific_expression_supplied: false
    contextual_transformer_output_supplied: false
    downstream_standardization: feature-wise mean and standard deviation from vocabulary-covered downstream training genes
    vocabulary_policy: exclude out-of-vocabulary genes identically from every matched condition
    heldout_targets: {hippocampus: 3574, dlpfc: 3574, nac: 3574, her2st: 3179}
  comparison_policy: parallel within-representation contrasts on exact common downstream targets; not a Decima-versus-scGPT leaderboard

model:
  class: FactorizedDotProductDecoder
  hidden_dimension: 512
  program_dimension: 96
  dropout: 0.1
  output: softplus

controls:
  pretrained: training-gene-standardized frozen vectors with the correct gene identity
  random: dimension-matched fixed standard-normal vectors
  constant: one zero vector shared by every gene
  shuffled: within-partition permutation of the standardized pretrained-vector multiset
  random_seed: analysis_seed + 12345
  shuffle_seed: analysis_seed + 810001
  shuffle_scope: downstream training and held-out partitions permuted independently and fixed through training, validation and test

optimization:
  epochs: 6
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0001
  batch_size: 256
  gradient_clip_norm: 1.0
  genes_per_batch_maximum: 512
  mse_weight: 1.0
  gene_correlation_loss_weight: 0.15
  checkpoint_score: validation_mean_gene_pcc - 0.02 * validation_mse
  validation_training_genes: 2048
  validation_gene_sampling: uniform_without_replacement
  seeds: [42, 123, 456]

evaluation:
  gene_eligibility: observed_variance_only
  eligible_constant_prediction_pcc: 0.0
  endpoints:
    - full_matrix_pcc
    - full_matrix_mse
    - gene_mean_pcc
    - gene_mean_rmse
    - mean_gene_pcc
    - median_gene_pcc
    - centered_full_matrix_pcc
    - centered_rmse
    - gene_mean_mse
    - centered_mse
  compatibility_aliases:
    abundance_pcc: gene_mean_pcc
    abundance_rmse: gene_mean_rmse
  constant_vector_gene_mean_pcc: undefined because predicted gene means have no across-gene variance
